include:
  - path:
      - docker-compose.yml
      - docker-compose-tests_include-override.yml

services:
  # Frontend Tests
  frontendTests:
    image: muraligorantla/frontend-tests:s0
    container_name: frontend-tests
    build:
      context: ./
      dockerfile: ./src/frontend/Dockerfile.cypress
    volumes:
      - ./src/frontend/cypress/videos:/app/cypress/videos
      - ./src/frontend/cypress/screenshots:/app/cypress/screenshots
    environment:
      - CYPRESS_baseUrl=http://${FRONTEND_ADDR}
      - FRONTEND_ADDR
      - NODE_ENV=production
    depends_on:
      - frontend

  # Tracebased Tests
  traceBasedTests:
    image: muraligorantla/trace-based-tests:s0
    container_name: traceBasedTests
    build:
      context: ./
      dockerfile: ./test/tracetesting/Dockerfile
      args:
        TRACETEST_IMAGE_VERSION: ${TRACETEST_IMAGE_VERSION}
    environment:
      - AD_ADDR
      - CART_ADDR
      - CHECKOUT_ADDR
      - CURRENCY_ADDR
      - EMAIL_ADDR
      - FRONTEND_ADDR
      - PAYMENT_ADDR
      - PRODUCT_CATALOG_ADDR
      - RECOMMENDATION_ADDR
      - SHIPPING_ADDR
      - KAFKA_ADDR
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./test/tracetesting:/app/test/tracetesting
      - ./pb:/app/pb
    depends_on:
      - tracetest-server
      - accounting
      - ad
      - cart
      - checkout
      - currency
      - email
      - fraud-detection
      - frontend
      - payment
      - product-catalog
      - quote
      - recommendation
      - shipping
      - flagd
      - kafka

  tracetest-server:
    image: kubeshop/tracetest:CHECK_VERSION_IN_ENV   # copy TRACETEST_IMAGE from .env
    platform: linux/amd64
    container_name: tracetest-server
    volumes:
      - type: bind
        source: ./test/tracetesting/tracetest-config.yaml
        target: /app/tracetest.yaml
      - type: bind
        source: ./test/tracetesting/tracetest-provision.yaml
        target: /app/provision.yaml
    command: --provisioning-file /app/provision.yaml
    ports:
      - 11633:11633
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tracetest-postgres
      - otel-collector
    healthcheck:
      test: [ "CMD", "wget", "--spider", "localhost:11633" ]
      interval: 1s
      timeout: 3s
      retries: 60

  tracetest-postgres:
    image: postgres:CHECK_VERSION_IN_ENV   # copy POSTGRES_IMAGE from .env
    container_name: tracetest-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 1s
      timeout: 5s
      retries: 60
    ports:
      - 5432
